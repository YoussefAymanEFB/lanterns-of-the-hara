<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset cutter</title>
<style>
  body { font: 14px system-ui, sans-serif; background: #15131f; color: #eee; margin: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  figure { margin: 0; } img { width: 100%; display: block; border-radius: 6px; } figcaption { font-size: 12px; opacity: .8; }
  pre { white-space: pre-wrap; font-size: 12px; }
</style>
</head>
<body>
<h1>Asset cutter</h1>
<p>Dev tool. Cuts the generated sheets in <code>assets/raw/</code> into single scenes and faces, compresses them to WebP, and saves them through <code>tools/serve.js</code> (localhost only). Open http://localhost:5173/tools/assets.html and press Run.</p>
<button id="run">Run</button>
<pre id="log"></pre>
<div class="grid" id="out"></div>
<script>
"use strict";
var JOBS = [
  { src: "../assets/raw/faces-sheet.png", cols: 3, rows: 3, dir: "faces", max: 320, inset: 0.03,
    names: ["saber", "saber_smile", "nemat", "hassan", "mama", "omyoussef", "youssef", "malak", "rizq"] },
  { src: "../assets/raw/scenes-a.png", cols: 2, rows: 2, dir: "scenes", max: 1024, inset: 0.012,
    names: ["home", "alley", "bakery", "steps"] },
  { src: "../assets/raw/scenes-b.png", cols: 2, rows: 2, dir: "scenes", max: 1024, inset: 0.012,
    names: ["table", "steps_iftar", "fulcart", "koshari"] },
  { src: "../assets/raw/scenes-c.png", cols: 2, rows: 2, dir: "scenes", max: 1024, inset: 0.012,
    names: ["kebab", "mosque", "roof", "workshop"] }
];
var logEl = document.getElementById("log"), out = document.getElementById("out");
function log(s) { logEl.textContent += s + "\n"; }

function loadImg(src) {
  return new Promise(function (ok, bad) { var i = new Image(); i.onload = function () { ok(i); }; i.onerror = bad; i.src = src; });
}
function isPaper(d, i) {
  var r = d[i], g = d[i + 1], b = d[i + 2];
  return r > 205 && g > 200 && b > 190 && Math.max(r, g, b) - Math.min(r, g, b) < 34;
}
// Find runs of "content" (non-paper) along one axis.
function runs(img, axis, want) {
  var c = document.createElement("canvas"); c.width = img.width; c.height = img.height;
  var x = c.getContext("2d"); x.drawImage(img, 0, 0);
  var d = x.getImageData(0, 0, c.width, c.height).data, W = c.width, H = c.height;
  var n = axis === "x" ? W : H, m = axis === "x" ? H : W, prof = new Array(n).fill(0);
  for (var a = 0; a < n; a++) {
    var cnt = 0;
    for (var bIdx = 0; bIdx < m; bIdx += 4) {
      var px = axis === "x" ? a : bIdx, py = axis === "x" ? bIdx : a;
      if (!isPaper(d, (py * W + px) * 4)) cnt++;
    }
    prof[a] = cnt / (m / 4);
  }
  var res = [], start = -1;
  for (var i = 0; i <= n; i++) {
    var on = i < n && prof[i] > 0.25;
    if (on && start < 0) start = i;
    if (!on && start >= 0) { if (i - start > n * 0.15) res.push([start, i]); start = -1; }
  }
  if (res.length !== want) {
    log("  " + axis + ": found " + res.length + " runs, expected " + want + ". Using equal split.");
    res = []; for (var k = 0; k < want; k++) res.push([Math.round(n * k / want), Math.round(n * (k + 1) / want)]);
  }
  return res;
}
function save(path, blob) {
  return fetch("/__save?path=" + encodeURIComponent(path), { method: "POST", body: blob }).then(function (r) { return r.text(); });
}
async function run() {
  logEl.textContent = ""; out.textContent = "";
  for (const job of JOBS) {
    log(job.src);
    const img = await loadImg(job.src);
    const xs = runs(img, "x", job.cols), ys = runs(img, "y", job.rows);
    let k = 0;
    for (let r = 0; r < job.rows; r++) for (let c = 0; c < job.cols; c++) {
      const name = job.names[k++];
      let x0 = xs[c][0], x1 = xs[c][1], y0 = ys[r][0], y1 = ys[r][1];
      const ins = Math.round(Math.min(x1 - x0, y1 - y0) * job.inset);
      x0 += ins; x1 -= ins; y0 += ins; y1 -= ins;
      const side = Math.min(x1 - x0, y1 - y0), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
      const sx = Math.round(cx - side / 2), sy = Math.round(cy - side / 2);
      const outSide = Math.min(job.max, side);
      const cv = document.createElement("canvas"); cv.width = cv.height = outSide;
      const ctx = cv.getContext("2d"); ctx.imageSmoothingQuality = "high";
      ctx.drawImage(img, sx, sy, side, side, 0, 0, outSide, outSide);
      const blob = await new Promise(function (ok) { cv.toBlob(ok, "image/webp", job.dir === "faces" ? 0.86 : 0.8); });
      const path = "assets/" + job.dir + "/" + name + ".webp";
      const msg = await save(path, blob);
      log("  " + name + ": crop " + side + "px at " + sx + "," + sy + " -> " + outSide + "px, " + Math.round(blob.size / 1024) + " KB · " + msg);
      const fig = document.createElement("figure"), im = document.createElement("img"), cap = document.createElement("figcaption");
      im.src = URL.createObjectURL(blob); cap.textContent = name; fig.appendChild(im); fig.appendChild(cap); out.appendChild(fig);
    }
  }
  log("done");
  window.__done = true;
}
document.getElementById("run").addEventListener("click", function () { run().catch(function (e) { log("ERROR " + e); }); });
</script>
</body>
</html>
